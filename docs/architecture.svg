<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" role="img" aria-label="mensurflow architecture: user code and the dashboard call the public headers; src/ops validates each call and hands it to dispatch() in src/core, which picks the execution device (or the tuner's stored choice), asks the Registry for that backend, looks the kernel up by op, device and dtype, applies tuned settings to tunable kernels, and runs it on the CPU, CUDA or Metal backend, copying data when the device differs from where the data lives.">
  <style>
