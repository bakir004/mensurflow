  <defs>
    <marker id="ah-hot" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-hot" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="ah-thin" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-thin" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="ah-tune" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-tune" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1600" height="1090"/>

  <text class="title" x="24" y="46">mensurflow, one call from top to bottom</text>
  <text class="sub" x="24" y="72">A C++ tensor library: one public API, kernels on CPU (OpenMP), CUDA and Metal, chosen per call by op, device and dtype, with kernel settings and devices tuned offline.</text>

  <!-- ============================================================ USER CODE -->
  <rect class="band" x="16" y="92" width="1568" height="120" rx="6"/>
  <text class="layer" x="30" y="120">USER CODE</text>
  <text class="path" x="30" y="138">your program</text>

  <rect class="box-hot" x="170" y="102" width="760" height="100" rx="6"/>
  <text class="m" x="186" y="126">Algorithm net([](const std::vector&lt;Tensor&gt;&amp; in) {</text>
  <text class="m" x="186" y="143">    return std::vector&lt;Tensor&gt;{relu(matmul(in[0], in[1], Execution::Auto))}; });</text>
  <text class="m" x="186" y="166">Tuner tuner("tuning.txt");  tuner.tune(net, inputs);  <tspan class="s">// offline, once per machine</tspan></text>
  <text class="m" x="186" y="186">net.run(inputs, tuner);                              <tspan class="s">// applies the stored results</tspan></text>

  <rect class="box" x="950" y="102" width="360" height="100" rx="6"/>
  <text class="h-sm" x="966" y="124">Observability dashboard</text>
  <text class="path" x="1150" y="124">observability/</text>
  <text class="b" x="966" y="146">index.html ↔ serve.py (HTTP :8765) → observe</text>
  <text class="s" x="966" y="165">op timings, traces, autotune view, CPU-or-GPU map</text>
  <text class="s" x="966" y="183">public API and the trace hook only, JSON out</text>

  <rect class="box" x="1330" y="102" width="246" height="100" rx="6"/>
  <text class="h-sm" x="1346" y="124">tests · examples · benchmarks</text>
  <text class="s" x="1346" y="146">40 ctest programs</text>
  <text class="s" x="1346" y="165">mlp_xor, tune_mlp</text>
  <text class="s" x="1346" y="183">vs OpenBLAS, BLIS, PyTorch</text>

  <!-- ============================================================ PUBLIC API -->
  <rect class="band" x="16" y="222" width="1568" height="116" rx="6"/>
  <text class="layer" x="30" y="250">PUBLIC API</text>
  <text class="path" x="30" y="268">include/mensurflow/</text>

  <rect class="box" x="170" y="232" width="345" height="46" rx="5"/>
  <text class="h-sm" x="184" y="251">tensor.hpp</text>
  <text class="s" x="184" y="269">Tensor · from_vector · to(device) · item() · views</text>
  <rect class="box" x="525" y="232" width="345" height="46" rx="5"/>
  <text class="h-sm" x="539" y="251">device.hpp · dtype.hpp · shape.hpp</text>
  <text class="s" x="539" y="269">Device{CPU, CUDA, Metal, Vulkan} · list_devices()</text>
  <rect class="box" x="880" y="232" width="345" height="46" rx="5"/>
  <text class="h-sm" x="894" y="251">execution.hpp</text>
  <text class="s" x="894" y="269">enum Execution { Auto, CPU, GPU }: where an op runs</text>
  <rect class="box" x="1235" y="232" width="341" height="46" rx="5"/>
  <text class="h-sm" x="1249" y="251">trace.hpp</text>
  <text class="s" x="1249" y="269">trace hook: spans of ops, kernels, copies</text>

  <rect class="box" x="170" y="284" width="700" height="46" rx="5"/>
  <text class="h-sm" x="184" y="303">ops/*.hpp: 106 ops</text>
  <text class="s" x="184" y="321">blas · elementwise · reduction · movement · indexing · random · softmax · loss · attention · conv · normalization · optimizers</text>
  <rect class="box-tune" x="880" y="284" width="696" height="46" rx="5"/>
  <text class="h-sm" x="894" y="303">tuning.hpp</text>
  <text class="s" x="894" y="321">Algorithm (a function of tensors) · Tuner(file) · tune(algorithm, inputs, TuneOptions) → TuneReport</text>

  <!-- ============================================================ OPS -->
  <rect class="band" x="16" y="348" width="1568" height="96" rx="6"/>
  <text class="layer" x="30" y="376">OPS</text>
  <text class="path" x="30" y="394">src/ops/</text>
  <text class="s" x="30" y="414">checks live here;</text>
  <text class="s" x="30" y="430">kernels trust inputs</text>

  <rect class="box" x="170" y="360" width="262" height="72" rx="6"/>
  <circle class="step-badge" cx="188" cy="380" r="10"/><text class="badge-t" x="184.5" y="384">1</text>
  <text class="h-sm" x="206" y="385">validate</text>
  <text class="s" x="186" y="410">shapes, dtypes, one device</text>
  <rect class="box" x="456" y="360" width="262" height="72" rx="6"/>
  <circle class="step-badge" cx="474" cy="380" r="10"/><text class="badge-t" x="470.5" y="384">2</text>
  <text class="h-sm" x="492" y="385">make contiguous</text>
  <text class="s" x="472" y="410">where the kernel needs stride 1</text>
  <rect class="box" x="742" y="360" width="262" height="72" rx="6"/>
  <circle class="step-badge" cx="760" cy="380" r="10"/><text class="badge-t" x="756.5" y="384">3</text>
  <text class="h-sm" x="778" y="385">allocate output</text>
  <text class="s" x="758" y="410">Tensor::empty on the data's device</text>
  <rect class="box-hot" x="1028" y="360" width="262" height="72" rx="6"/>
  <circle class="step-badge" cx="1046" cy="380" r="10"/><text class="badge-t" x="1042.5" y="384">4</text>
  <text class="h-sm" x="1064" y="385">dispatch</text>
  <text class="mm" x="1044" y="410">dispatch(OpId::Matmul, args, exec)</text>
  <rect class="box" x="1314" y="360" width="262" height="72" rx="6"/>
  <circle class="step-badge" cx="1332" cy="380" r="10"/><text class="badge-t" x="1328.5" y="384">5</text>
  <text class="h-sm" x="1350" y="385">record autograd</text>
  <text class="s" x="1330" y="410">node: parents + backward</text>
  <path class="a-thin" d="M432 396 L452 396" marker-end="url(#ah-thin)"/>
  <path class="a-thin" d="M718 396 L738 396" marker-end="url(#ah-thin)"/>
  <path class="a-thin" d="M1004 396 L1024 396" marker-end="url(#ah-thin)"/>
  <path class="a-thin" d="M1290 396 L1310 396" marker-end="url(#ah-thin)"/>

  <!-- arrows between the top layers -->
  <path class="a-hot" d="M400 202 L400 228" marker-end="url(#ah-hot)"/>
  <text class="lbl-hot" x="412" y="219">calls</text>
  <path class="a-thin" d="M1130 202 L1130 228" marker-end="url(#ah-thin)"/>
  <path class="a-hot" d="M520 330 L520 356" marker-end="url(#ah-hot)"/>
  <text class="lbl-hot" x="532" y="347">each op function</text>

  <!-- ============================================================ CORE -->
  <rect class="band" x="16" y="454" width="1568" height="336" rx="6"/>
  <text class="layer" x="30" y="482">CORE</text>
  <text class="path" x="30" y="500">src/core/</text>

  <!-- tables + registry, left -->
  <rect class="box" x="170" y="466" width="350" height="170" rx="6"/>
  <text class="h-sm" x="186" y="488">Dispatcher tables</text>
  <text class="path" x="186" y="505">dispatcher.hpp</text>
  <text class="m" x="186" y="528">map&lt;(op, device, dtype), KernelFn&gt;</text>
  <text class="s" x="186" y="546">a missing key → NotImplemented, never a</text>
  <text class="s" x="186" y="562">silent fallback to another device</text>
  <text class="m" x="186" y="588">map&lt;(op, device, dtype), TunableKernel&gt;</text>
  <text class="s" x="186" y="606">matmul · cpu, matmul · metal: version, key(),</text>
  <text class="s" x="186" y="622">params, defaults(), space(), allowed()</text>

  <rect class="box" x="170" y="646" width="350" height="134" rx="6"/>
  <text class="h-sm" x="186" y="668">Registry</text>
  <text class="path" x="260" y="668">registry.cpp · built on first use</text>
  <text class="m" x="186" y="692">register_cpu_backend()   <tspan class="s">required</tspan></text>
  <text class="m" x="186" y="711">register_cuda_backend()  <tspan class="s">if built</tspan></text>
  <text class="m" x="186" y="730">register_metal_backend() <tspan class="s">if built</tspan></text>
  <text class="s" x="186" y="752">a backend that fails to start is skipped</text>
  <text class="m" x="186" y="771">get(device) · find(type) · devices()</text>

  <!-- dispatcher, centre -->
  <rect class="box-hot" x="544" y="466" width="660" height="314" rx="6"/>
  <text class="h" x="562" y="490">dispatch(op, args, execution)</text>
  <text class="path" x="790" y="490">dispatcher.cpp</text>
  <g>
    <text class="m hot-t" x="562" y="520">a</text><text class="b" x="584" y="520">all tensors on one device: the <tspan font-weight="600">data device</tspan></text>
    <text class="m tune-t" x="562" y="550">b</text><text class="b" x="584" y="550">tuner active → apply_tuning(): Auto → the stored device choice (gpu=0/1), if any</text>
    <text class="m hot-t" x="562" y="580">c</text><text class="b" x="584" y="580">execution_device(): Auto → cpu:0 · CPU → cpu:0 · GPU → the data's GPU, else CUDA, else Metal</text>
    <text class="m hot-t" x="562" y="610">d</text><text class="b" x="584" y="610">Registry::get(target) → Backend&amp;, its Stream</text>
    <text class="m hot-t" x="562" y="640">e</text><text class="b" x="584" y="640">lookup({op, target type, dtype}) → KernelFn</text>
    <text class="m tune-t" x="562" y="670">f</text><text class="b" x="584" y="670">… and for a tunable kernel, its stored settings → <tspan class="m">OpArgs::tuning</tspan></text>
    <text class="m hot-t" x="562" y="700">g</text><text class="b" x="584" y="700">target == data device ? kernel(args, stream)</text>
    <text class="b" x="584" y="720">: copy the inputs over, run into fresh outputs there, copy the results back</text>
    <text class="s" x="562" y="752">MENSURFLOW_TRACE spans: the op, the kernel, every copy (seen by the trace hook and the dashboard)</text>
  </g>

  <!-- tuning + memory, right -->
  <rect class="box-tune" x="1228" y="466" width="348" height="196" rx="6"/>
  <text class="h-sm" x="1244" y="488">Auto-tuning</text>
  <text class="path" x="1340" y="488">tuning.cpp · docs/autotuning.svg</text>
  <text class="b" x="1244" y="512">Tuner::tune: record the calls, search each</text>
  <text class="b" x="1244" y="530">kernel's space, time, confirm, choose devices</text>
  <text class="b" x="1244" y="556">TuningCache: the results file, one line per</text>
  <text class="b" x="1244" y="574">call, keyed on machine, op, device, version,</text>
  <text class="b" x="1244" y="592">m n k (+ threads)</text>
  <text class="b" x="1244" y="618">TuningScope (thread_local): record calls, or</text>
  <text class="b" x="1244" y="636">apply stored results while it is open</text>

  <rect class="box" x="1228" y="672" width="348" height="108" rx="6"/>
  <text class="h-sm" x="1244" y="694">Memory and autograd</text>
  <text class="m" x="1244" y="718">Tensor → Storage → Buffer</text>
  <text class="s" x="1244" y="736">view (shape, strides, offset) → owns → device memory</text>
  <text class="m" x="1244" y="760">autograd.cpp</text>
  <text class="s" x="1340" y="760">graph of nodes, backward()</text>

  <!-- core arrows -->
  <path class="a-hot" d="M1100 432 L1100 462" marker-end="url(#ah-hot)"/>
  <text class="lbl-hot" x="1112" y="452">OpArgs + Execution</text>
  <path class="a-thin" d="M556 640 L548 640 L548 590 L524 590" marker-end="url(#ah-thin)"/>
  <path class="a-thin" d="M556 610 L552 610 L552 700 L524 700" marker-end="url(#ah-thin)"/>
  <path class="a-tune" d="M1204 550 L1224 550" marker-end="url(#ah-tune)"/>
  <path class="a-tune" d="M1204 670 L1214 670 L1214 610 L1224 610" marker-end="url(#ah-tune)"/>

  <!-- ============================================================ BACKENDS -->
  <rect class="band" x="16" y="800" width="1568" height="234" rx="6"/>
  <text class="layer" x="30" y="828">BACKENDS</text>
  <text class="path" x="30" y="846">src/backends/</text>

  <rect class="box" x="170" y="812" width="250" height="210" rx="6"/>
  <text class="h-sm" x="186" y="834">class Backend</text>
  <text class="path" x="290" y="834">backend.hpp</text>
  <text class="m" x="186" y="862">type()</text>
  <text class="m" x="186" y="884">device_count()</text>
  <text class="m" x="186" y="906">allocate() → Buffer</text>
  <text class="m" x="186" y="928">stream() → Stream</text>
  <text class="m" x="186" y="950">register_kernels()</text>
  <text class="s" x="186" y="980">a new backend implements these</text>
  <text class="s" x="186" y="996">and touches nothing above</text>

  <rect class="box-hot" x="440" y="812" width="460" height="210" rx="6"/>
  <text class="h" x="456" y="836">CPU</text>
  <text class="s" x="494" y="836">always built · all 106 ops</text>
  <text class="path" x="760" y="836">cpu/</text>
  <text class="b" x="456" y="862">OpenMP (MENSURFLOW_PARALLEL_FOR), thread pool, affinity</text>
  <text class="s" x="456" y="884">ops/: blas · gemm (packed AVX2, batched) · elementwise · conv · pooling</text>
  <text class="s" x="456" y="902">reduction · movement · indexing · random · softmax · loss · norm · optimizers</text>
  <rect class="box-tune" x="456" y="918" width="428" height="92" rx="5"/>
  <text class="h-sm tune-t" x="470" y="940">tunable: matmul</text>
  <text class="m" x="470" y="962">rows · depth · cols</text>
  <text class="s" x="470" y="982">tile sizes of the portable kernel (bit-identical for all)</text>
  <text class="s" x="470" y="999">the AVX2 packed kernel is not tunable yet</text>

  <rect class="box" x="920" y="812" width="200" height="210" rx="6"/>
  <text class="h" x="936" y="836">CUDA</text>
  <text class="path" x="936" y="856">MENSURFLOW_CUDA</text>
  <text class="b" x="936" y="884">dot, add, sub, mul</text>
  <text class="s" x="936" y="906">own kernels, 4 ops</text>
  <text class="s" x="936" y="928">copy back waits for</text>
  <text class="s" x="936" y="944">the stream</text>

  <rect class="box-hot" x="1140" y="812" width="276" height="210" rx="6"/>
  <text class="h" x="1156" y="836">Metal</text>
  <text class="path" x="1210" y="836">MENSURFLOW_METAL · macOS</text>
  <text class="b" x="1156" y="862">MPSGraph: dot, add, sub, mul, div</text>
  <text class="b" x="1156" y="882">matmul: own shaders (gemm.mm)</text>
  <text class="s" x="1156" y="900">unified memory: copies are memcpy</text>
  <rect class="box-tune" x="1156" y="912" width="244" height="98" rx="5"/>
  <text class="h-sm tune-t" x="1170" y="934">tunable: matmul</text>
  <text class="s" x="1170" y="954">kernel: tiled · simdgroup · MPS</text>
  <text class="m" x="1170" y="974">bm bn bk tm tn sg_m sg_n</text>
  <text class="s" x="1170" y="994">a pipeline compiled per tile size</text>

  <rect class="box-plan" x="1436" y="812" width="140" height="210" rx="6"/>
  <text class="h dim" x="1452" y="836" style="fill:#5d6875">Vulkan</text>
  <text class="s" x="1452" y="858">planned</text>
  <text class="s" x="1452" y="884">DeviceType::Vulkan</text>
  <text class="s" x="1452" y="900">is reserved; no</text>
  <text class="s" x="1452" y="916">backend, so get()</text>
  <text class="s" x="1452" y="932">throws</text>

  <!-- core to backends -->
  <path class="a-hot" d="M870 780 L870 808" marker-end="url(#ah-hot)"/>
  <text class="lbl-hot" x="882" y="797">kernel(args, stream) on the target device</text>
  <path class="a-start" d="M300 780 L300 808" marker-end="url(#ah-thin)"/>
  <text class="lbl" x="308" y="797">add(backend), then backend.register_kernels(dispatcher)</text>

  <!-- legend -->
  <path class="a-hot" d="M24 1060 L64 1060" marker-end="url(#ah-hot)"/><text class="s" x="72" y="1064">path of one call</text>
  <path class="a-thin" d="M200 1060 L240 1060" marker-end="url(#ah-thin)"/><text class="s" x="248" y="1064">lookup / helper call</text>
  <path class="a-start" d="M400 1060 L440 1060" marker-end="url(#ah-thin)"/><text class="s" x="448" y="1064">once, when the Registry is first used</text>
  <path class="a-tune" d="M680 1060 L720 1060" marker-end="url(#ah-tune)"/><text class="s" x="728" y="1064">auto-tuning: stored device choices and kernel settings</text>
  <rect class="box-plan" x="1100" y="1052" width="36" height="16" rx="3"/><text class="s" x="1144" y="1064">planned, not built</text>
</svg>
